name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install media verification dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install Python verification dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps --requirement requirements-dev.txt
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test
      - name: Run model-free WebMCP evaluator smoke
        run: npm run webmcp:eval:smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && hashFiles('.evals/webmcp-smoke-receipt.json') != '' }}
        with:
          name: govuk-webmcp-dist-${{ github.sha }}
          path: |
            dist/
            .evals/webmcp-smoke-receipt.json
          if-no-files-found: error
          retention-days: 14
