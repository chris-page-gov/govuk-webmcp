name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: govuk-webmcp-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
